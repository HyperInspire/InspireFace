plugins {
    alias(libs.plugins.android.application)
}

// Both modes consume the complete SDK, including its models and JNI consumer rules.
// Keep machine-specific paths out of source control; never fall back between modes.
def sdkSource = providers.gradleProperty('inspirefaceSdkSource').getOrElse('jitpack')
def localSdkAar
if (sdkSource == 'local') {
    def sdkProperties = new Properties()
    def sdkPropertiesFile = rootProject.file('sdk.local.properties')
    if (sdkPropertiesFile.exists()) {
        sdkPropertiesFile.withInputStream { sdkProperties.load(it) }
    }
    def aarPath = providers.gradleProperty('inspirefaceSdkAar')
            .getOrElse(sdkProperties.getProperty('aarPath', ''))
    if (aarPath.trim().isEmpty()) {
        throw new GradleException('Set aarPath in sdk.local.properties (see sdk.local.properties.example), '
                + 'or pass -PinspirefaceSdkAar=/path/to/inspireface-release.aar.')
    }
    localSdkAar = rootProject.file(aarPath)
    if (!localSdkAar.isFile() || !localSdkAar.name.endsWith('.aar')) {
        throw new GradleException("Local InspireFace AAR does not exist: ${localSdkAar}")
    }
} else if (sdkSource != 'jitpack') {
    throw new GradleException("Unknown inspirefaceSdkSource '${sdkSource}'; use local or jitpack.")
}

// Developer-supplied business credentials; never commit this file.
def plusProperties = new Properties()
def plusFile = rootProject.file('plus.local.properties')
if (plusFile.exists()) {
    plusFile.withInputStream { plusProperties.load(it) }
}

def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = releaseKeystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    releaseKeystorePropertiesFile.withInputStream {
        releaseKeystoreProperties.load(it)
    }
}

android {
    namespace 'com.example.inspireface_example'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.inspireface_example"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.0.3"
        buildConfigField 'String', 'INSPIREFACE_SDK_VERSION', groovy.json.JsonOutput.toJson(
                libs.versions.inspireface.get())
        buildConfigField 'String', 'INSPIREFACE_SDK_SOURCE', groovy.json.JsonOutput.toJson(sdkSource)
        buildConfigField 'String', 'PLUS_API_BASE', groovy.json.JsonOutput.toJson(
                plusProperties.getProperty('apiBase', 'https://api.inspirehub.cc'))
        buildConfigField 'String', 'PLUS_TOKEN', groovy.json.JsonOutput.toJson(
                plusProperties.getProperty('token', ''))

        ndk {
            // Native libraries supplied by the complete InspireFace 1.2.4.post1 AAR.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                storeType releaseKeystoreProperties.getProperty('storeType', 'JKS')
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.exifinterface
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    if (sdkSource == 'local') {
        implementation files(localSdkAar)
    } else {
        implementation libs.inspireface.android
    }
}
