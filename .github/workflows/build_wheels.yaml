name: Build Wheels

on:
  push:
    branches: ["release/wheels"]
  pull_request:
    branches: ["release/wheels"]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Reuse artifacts from this Build Wheels run; leave empty to build"
        type: string
        default: ""
      expected_version:
        description: "Expected package version (required when reusing artifacts)"
        type: string
        default: ""
      publish:
        description: "Publish validated wheels to PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build_manylinux2014_x86_64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile manylinux2014_x86_64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-x86 build-manylinux2014-x86
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_manylinux2014_aarch64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile manylinux2014_aarch64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-aarch64 build-manylinux2014-aarch64
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-aarch64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_macos_arm64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile MacOS-arm64
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_arm64.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_macos_x86_64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile MacOS-x86_64
    runs-on: macos-15-intel
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_x86.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  upload_to_pypi:
    name: Validate and Publish Wheels
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'workflow_dispatch' && inputs.source_run_id != '') ||
           (needs.build_manylinux2014_x86_64.result == 'success' &&
            needs.build_manylinux2014_aarch64.result == 'success' &&
            needs.build_macos_arm64.result == 'success' &&
            needs.build_macos_x86_64.result == 'success')) }}
    needs: [build_manylinux2014_x86_64, build_manylinux2014_aarch64, build_macos_arm64, build_macos_x86_64]
    runs-on: ubuntu-latest
    concurrency:
      group: inspireface-pypi-publish
      cancel-in-progress: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check source run
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python ci/pypi/check_source_run.py

      # Never extract separate artifacts over the same wheel filename.
      - name: Download wheels into separate directories
        uses: actions/download-artifact@v4
        with:
          path: wheel-artifacts
          pattern: "*wheels*"
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}

      - name: Check wheel collection logic
        run: python -m unittest discover -s ci/pypi/tests -v

      - name: Collect and validate four platform wheels
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          args=(--artifacts wheel-artifacts --output dist)
          if [[ -n "$EXPECTED_VERSION" ]]; then
            args+=(--version "$EXPECTED_VERSION")
          fi
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            args+=(--legacy-macos-python 3.12)
          fi
          python ci/pypi/prepare_wheels.py "${args[@]}"

      - name: Check PyPI metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl

      - name: Save validated release files
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          
      - name: Upload to PyPI
        if: >-
          ${{ (github.event_name == 'push' &&
               (github.ref == 'refs/heads/release/wheels' || github.ref == 'refs/heads/development')) ||
              (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -z "$TWINE_PASSWORD" ]]; then
            echo "::error::Repository secret PYPI_API_TOKEN is not configured"
            exit 1
          fi
          python -m twine upload --non-interactive dist/*.whl
