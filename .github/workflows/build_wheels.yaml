name: Build Wheels

on:
  push:
    branches: ["release/wheels"]
  pull_request:
    branches: ["release/wheels"]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Reuse artifacts from this Build Wheels run; leave empty to build"
        type: string
        default: ""
      expected_version:
        description: "Expected package version (required when reusing artifacts)"
        type: string
        default: ""
      publish:
        description: "Publish validated wheels to PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build_manylinux2014_x86_64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile manylinux2014_x86_64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-x86 build-manylinux2014-x86
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_manylinux2014_aarch64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile manylinux2014_aarch64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-aarch64 build-manylinux2014-aarch64
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-aarch64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_macos_arm64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile MacOS-arm64
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_arm64.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_macos_x86_64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile MacOS-x86_64
    runs-on: macos-15-intel
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_x86.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  build_windows_x64:
    if: ${{ inputs.source_run_id == '' }}
    name: Compile Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Windows build environment
        uses: ./.github/actions/windows-setup

      - name: Build the wheel
        run: .\command\build_wheel_windows.ps1 -PythonExecutable python

      - name: Install and verify the wheel
        run: |
          $wheels = @(Get-ChildItem -LiteralPath python/dist -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected exactly one Windows wheel.' }
          $venv = Join-Path $env:RUNNER_TEMP 'inspireface-wheel-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the wheel verification environment.' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed.' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel dependencies are inconsistent.' }
          & $python -I ci/windows/verify_wheel_install.py --wheel $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows wheel validation failed.' }

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-wheels
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  upload_to_pypi:
    name: Validate and Publish Wheels
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'workflow_dispatch' && inputs.source_run_id != '') ||
           (needs.build_manylinux2014_x86_64.result == 'success' &&
            needs.build_manylinux2014_aarch64.result == 'success' &&
            needs.build_macos_arm64.result == 'success' &&
            needs.build_macos_x86_64.result == 'success' &&
            needs.build_windows_x64.result == 'success')) }}
    needs: [build_manylinux2014_x86_64, build_manylinux2014_aarch64, build_macos_arm64, build_macos_x86_64, build_windows_x64]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.collect.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    concurrency:
      group: inspireface-pypi-publish
      cancel-in-progress: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check source run
        if: ${{ inputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python ci/pypi/check_source_run.py

      # Never extract separate artifacts over the same wheel filename.
      - name: Download wheels into separate directories
        uses: actions/download-artifact@v4
        with:
          path: wheel-artifacts
          pattern: "*wheels*"
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}

      - name: Check wheel collection logic
        run: python -m unittest discover -s ci/pypi/tests -v

      - name: Collect and validate five platform wheels
        id: collect
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          args=(--artifacts wheel-artifacts --output dist --manifest pypi-release-manifest.json)
          if [[ -n "$EXPECTED_VERSION" ]]; then
            args+=(--version "$EXPECTED_VERSION")
          fi
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            args+=(--legacy-macos-python 3.12)
          fi
          python ci/pypi/prepare_wheels.py "${args[@]}"

      - name: Check PyPI metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl

      - name: Save validated release files
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Save release hashes for PyPI installation checks
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-manifest
          path: pypi-release-manifest.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          
      - name: Upload to PyPI
        id: publish
        if: >-
          ${{ (github.event_name == 'push' &&
               (github.ref == 'refs/heads/release/wheels' ||
                github.ref == 'refs/heads/development')) ||
              (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -z "$TWINE_PASSWORD" ]]; then
            echo "::error::Repository secret PYPI_API_TOKEN is not configured"
            exit 1
          fi
          python -m twine upload --non-interactive dist/*.whl
          echo "published=true" >> "$GITHUB_OUTPUT"

  wait_for_pypi:
    name: Wait five minutes for PyPI
    needs: upload_to_pypi
    if: >-
      ${{ !cancelled() && needs.upload_to_pypi.result == 'success' &&
          needs.upload_to_pypi.outputs.published == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Allow the published files to reach PyPI indexes
        run: sleep 300

  verify_published_wheels:
    name: Test PyPI package (${{ matrix.platform }})
    needs: [upload_to_pypi, wait_for_pypi]
    if: >-
      ${{ !cancelled() && needs.upload_to_pypi.result == 'success' &&
          needs.upload_to_pypi.outputs.published == 'true' &&
          needs.wait_for_pypi.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            architecture: x64
          - platform: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - platform: darwin-x64
            runner: macos-15-intel
            architecture: x64
          - platform: darwin-arm64
            runner: macos-14
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}

      - name: Download release hashes
        uses: actions/download-artifact@v4
        with:
          name: pypi-release-manifest
          path: build/pypi-release-manifest

      - name: Install this release from PyPI and run inference
        env:
          EXPECTED_VERSION: ${{ needs.upload_to_pypi.outputs.version }}
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: |
          python ci/pypi/run_published_smoke.py \
            --version "$EXPECTED_VERSION" \
            --platform "$SMOKE_PLATFORM" \
            --image test_res/data/bulk/kun.jpg \
            --output-dir build/pypi-smoke \
            --venv-dir "$RUNNER_TEMP/inspireface-pypi-smoke-venv" \
            --manifest build/pypi-release-manifest/pypi-release-manifest.json

      - name: Upload installed-package test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pypi-smoke-${{ matrix.platform }}
          path: build/pypi-smoke/
          if-no-files-found: warn
          retention-days: 14
