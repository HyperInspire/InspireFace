name: Build Wheels

on:
  push:
    branches: ["release/wheels", "development"]
  pull_request:
    branches: ["release/wheels"]

env:
  GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

jobs:
  build_manylinux2014_x86_64:
    name: Compile manylinux2014_x86_64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-x86 build-manylinux2014-x86
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-wheels
          path: python/dist/*
          retention-days: 1

  build_manylinux2014_aarch64:
    name: Compile manylinux2014_aarch64
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
        
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          
      - name: Execute Docker Compose
        run: |
          docker-compose up --exit-code-from build-manylinux2014-aarch64 build-manylinux2014-aarch64
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manylinux2014-aarch64-wheels
          path: python/dist/*
          retention-days: 1

  build_macos_arm64:
    name: Compile MacOS-arm64
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_arm64.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wheels-py${{ matrix.python-version }}
          path: python/dist/*
          retention-days: 1

  build_macos_x86_64:
    name: Compile MacOS-x86_64
    runs-on: macos-15-intel
    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Update submodules
        run: |
          git clone --recurse-submodules https://github.com/tunmx/inspireface-3rdparty.git 3rdparty
          
      - name: Install Dependencies
        run: |
          brew uninstall cmake
          brew install cmake
          
      - name: Build the SDK
        run: |
          bash command/build_wheel_macos_x86.sh
          ls python/dist
          
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-wheels-py${{ matrix.python-version }}
          path: python/dist/*
          retention-days: 1

  upload_to_pypi:
    name: Upload Wheels to PyPI
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release/wheels' || github.ref == 'refs/heads/development')
    needs: [build_manylinux2014_x86_64, build_manylinux2014_aarch64, build_macos_arm64, build_macos_x86_64]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
          python -m twine upload --non-interactive dist/*.whl
