name: Build macOS x86_64 CPU SDK

on:
  push:
    branches: ["feature/macos_x86"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: '15.0'
  ISF_BUILD_JOBS: '3'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apple-setup
      - name: Build the native SDK without runtime tests
        run: python3 command/apple/build_sdk.py --platform macosx --arch x86_64 --backend cpu
