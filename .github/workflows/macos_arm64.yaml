name: Validate macOS arm64 CPU SDK

on:
  push:
    branches: ["feature/macos_arm64"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  ISF_BUILD_JOBS: '3'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/apple-setup
        with:
          test-fixtures: 'true'
      - name: Build, test and verify the installed native SDK
        run: python3 command/apple/build_sdk.py --platform macosx --arch arm64 --backend cpu --verify --coverage
